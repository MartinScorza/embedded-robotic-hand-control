name: DFRobot legacy TI build

on:
  push:
    branches:
      - fix/dfrobot-deterministic-defects

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      SDK_URL: https://dr-download.ti.com/software-development/software-development-kit-sdk/MD-dSV82B3Lb6/3.40.01.02/simplelink_msp432p4_sdk_3_40_01_02.run
      CGT_URL: https://dr-download.ti.com/software-development/ide-configuration-compiler-or-debugger/MD-sDOoXkUcde/20.2.7.LTS/ti_cgt_tms470_20.2.7.LTS_linux-x64_installer.bin

    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/dfrobot-deterministic-defects

      - name: Download TI legacy SDK and compiler
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/ti-downloads" "$RUNNER_TEMP/ti"
          curl -fL --retry 3 --retry-delay 2 "$SDK_URL" -o "$RUNNER_TEMP/ti-downloads/msp432-sdk.run"
          curl -fL --retry 3 --retry-delay 2 "$CGT_URL" -o "$RUNNER_TEMP/ti-downloads/arm-cgt.bin"
          chmod +x "$RUNNER_TEMP/ti-downloads/msp432-sdk.run" "$RUNNER_TEMP/ti-downloads/arm-cgt.bin"

      - name: Install TI legacy SDK and compiler
        shell: bash
        run: |
          set -euxo pipefail
          "$RUNNER_TEMP/ti-downloads/msp432-sdk.run" --mode unattended --prefix "$RUNNER_TEMP/ti/sdk"
          "$RUNNER_TEMP/ti-downloads/arm-cgt.bin" --mode unattended --prefix "$RUNNER_TEMP/ti/cgt"

          echo "Installed TI files:"
          find "$RUNNER_TEMP/ti" -maxdepth 3 -type f \( -name armcl -o -name driverlib.h -o -name msp432p401r.cmd \) -print || true

      - name: Resolve toolchain paths
        shell: bash
        run: |
          set -euxo pipefail

          ARMCL="$(find "$RUNNER_TEMP/ti/cgt" -type f -name armcl -perm -111 | head -1)"
          SDK_SOURCE="$(find "$RUNNER_TEMP/ti/sdk" -type d -path '*/source/ti/devices/msp432p4xx' -print | head -1 | sed 's#/ti/devices/msp432p4xx$##')"

          test -n "$ARMCL"
          test -n "$SDK_SOURCE"

          CGT_ROOT="$(cd "$(dirname "$ARMCL")/.." && pwd)"
          SDK_ROOT="$(cd "$SDK_SOURCE/.." && pwd)"

          STARTUP="$(find "$SDK_ROOT/source/ti/devices/msp432p4xx/startup_system_files/ccs" -type f -name startup_msp432p401r_ccs.c | head -1)"
          SYSTEM="$(find "$SDK_ROOT/source/ti/devices/msp432p4xx/startup_system_files" -type f -name system_msp432p401r.c | head -1)"
          LINKER_CMD="$(find "$SDK_ROOT" -type f -name msp432p401r.cmd | head -1)"

          test -f "$STARTUP"
          test -f "$SYSTEM"
          test -f "$LINKER_CMD"
          test -f "$SDK_ROOT/source/ti/devices/msp432p4xx/driverlib/ccs/msp432p4xx_driverlib.lib"
          test -f "$SDK_ROOT/source/ti/grlib/lib/ccs/m4f/grlib.a"

          {
            echo "ARMCL=$ARMCL"
            echo "CGT_ROOT=$CGT_ROOT"
            echo "SDK_ROOT=$SDK_ROOT"
            echo "STARTUP=$STARTUP"
            echo "SYSTEM=$SYSTEM"
            echo "LINKER_CMD=$LINKER_CMD"
          } >> "$GITHUB_ENV"

          "$ARMCL" --version

      - name: Compile DFRobot sources
        shell: bash
        run: |
          set -euxo pipefail
          BUILD="$RUNNER_TEMP/dfrobot-build"
          mkdir -p "$BUILD"

          COMMON=(
            -mv7M4
            --code_state=16
            --float_support=FPv4SPD16
            -me
            --include_path="$GITHUB_WORKSPACE/firmware/dfrobot-hand"
            --include_path="$SDK_ROOT/source"
            --include_path="$SDK_ROOT/source/third_party/CMSIS/Include"
            --include_path="$CGT_ROOT/include"
            --advice:power=none
            --define=__MSP432P401R__
            --define=DeviceFamily_MSP432P401x
            -g
            --diag_warning=225
            --diag_warning=255
            --diag_wrap=off
            --display_error_number
            --gen_func_subsections=on
          )

          "$ARMCL" "${COMMON[@]}" -c "$GITHUB_WORKSPACE/firmware/dfrobot-hand/main.c" --output_file="$BUILD/main.obj"
          "$ARMCL" "${COMMON[@]}" -c "$GITHUB_WORKSPACE/firmware/dfrobot-hand/Fonctions.c" --output_file="$BUILD/Fonctions.obj"
          "$ARMCL" "${COMMON[@]}" -c "$GITHUB_WORKSPACE/firmware/dfrobot-hand/LcdDriver/Crystalfontz128x128_ST7735.c" --output_file="$BUILD/Crystalfontz128x128_ST7735.obj"
          "$ARMCL" "${COMMON[@]}" -c "$GITHUB_WORKSPACE/firmware/dfrobot-hand/LcdDriver/HAL_MSP_EXP432P401R_Crystalfontz128x128_ST7735.c" --output_file="$BUILD/HAL_MSP_EXP432P401R_Crystalfontz128x128_ST7735.obj"
          "$ARMCL" "${COMMON[@]}" -c "$SYSTEM" --output_file="$BUILD/system_msp432p401r.obj"
          "$ARMCL" "${COMMON[@]}" -c "$STARTUP" --output_file="$BUILD/startup_msp432p401r_ccs.obj"

      - name: Link DFRobot firmware
        shell: bash
        run: |
          set -euxo pipefail
          BUILD="$RUNNER_TEMP/dfrobot-build"

          "$ARMCL" \
            -mv7M4 --code_state=16 --float_support=FPv4SPD16 -me \
            --advice:power=none \
            --define=__MSP432P401R__ \
            --define=DeviceFamily_MSP432P401x \
            -g --diag_warning=225 --diag_warning=255 --diag_wrap=off \
            --display_error_number --gen_func_subsections=on \
            -z \
            -m"$BUILD/dfrobot.map" \
            --stack_size=512 \
            -i"$SDK_ROOT/source" \
            -i"$CGT_ROOT/lib" \
            --warn_sections \
            --rom_model \
            -o "$BUILD/dfrobot.out" \
            "$BUILD/Fonctions.obj" \
            "$BUILD/main.obj" \
            "$BUILD/system_msp432p401r.obj" \
            "$BUILD/Crystalfontz128x128_ST7735.obj" \
            "$BUILD/HAL_MSP_EXP432P401R_Crystalfontz128x128_ST7735.obj" \
            "$BUILD/startup_msp432p401r_ccs.obj" \
            "$LINKER_CMD" \
            -l"$SDK_ROOT/source/ti/grlib/lib/ccs/m4f/grlib.a" \
            -l"$SDK_ROOT/source/ti/devices/msp432p4xx/driverlib/ccs/msp432p4xx_driverlib.lib" \
            -llibc.a

          test -s "$BUILD/dfrobot.out"
          echo "DFRobot firmware link PASS"
